<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CueGFX – Anmeldung</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d0f12;color:#e7eaee;font:15px system-ui,sans-serif}
form{background:#14171c;border:1px solid #2b313b;border-radius:12px;padding:28px;width:min(340px,90vw)}
h1{font-size:18px;margin:0 0 6px}p{color:#a3abb8;margin:0 0 16px;font-size:13px}
input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a424f;background:#0d0f12;color:inherit;font-size:18px;letter-spacing:.2em;text-align:center}
button{margin-top:12px;width:100%;padding:10px;border-radius:8px;border:0;background:#3b82f6;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style></head><body>
<form method="get" action="/control"><h1>CueGFX</h1><p>Diese Steuerung ist mit einer PIN geschützt.</p>
<input name="pin" type="password" inputmode="numeric" autofocus placeholder="PIN"><button>Anmelden</button></form>
</body></html>
