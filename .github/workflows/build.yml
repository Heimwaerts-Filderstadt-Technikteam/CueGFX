# CueGFX – baut macOS (arm64 + x64), Windows und Linux auf GitHub-Runnern.
#
# Start:  Reiter "Actions" → "Build CueGFX" → "Run workflow"
#         oder automatisch beim Push eines Tags wie v1.0.0 (dann mit GitHub-Release)
#
# DeckLink-SDK (darf NICHT öffentlich liegen!) – je Betriebssystem ein Secret
# mit dem Direkt-Download-Link zum jeweiligen SDK-Paket (.zip, .tar.gz oder .dmg):
#   DECKLINK_SDK_URL_MAC     – macOS-SDK
#   DECKLINK_SDK_URL_WIN     – Windows-SDK
#   DECKLINK_SDK_URL_LINUX   – Linux-SDK
#   DECKLINK_SDK_URL         – optional: Komplett-SDK für alle, falls ein OS-Secret fehlt
# Fehlt das Secret für ein OS, wird dieses OS ohne DeckLink gebaut (NDI bleibt).
name: Build CueGFX

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: mac-arm64, cmd: 'npx electron-builder --mac --arm64 -c.mac.identity=-' }
          - { os: macos-15-intel, name: mac-x64,   cmd: 'npx electron-builder --mac --x64 -c.mac.identity=-' }
          - { os: windows-latest, name: windows,   cmd: 'npx electron-builder --win' }
          - { os: ubuntu-22.04,   name: linux,     cmd: 'npx electron-builder --linux' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential rpm fakeroot

      - name: DeckLink-SDK laden (optional)
        shell: bash
        env:
          URL_OS: ${{ runner.os == 'macOS' && secrets.DECKLINK_SDK_URL_MAC || runner.os == 'Windows' && secrets.DECKLINK_SDK_URL_WIN || secrets.DECKLINK_SDK_URL_LINUX }}
          URL_ALL: ${{ secrets.DECKLINK_SDK_URL }}
        run: |
          SDK_URL="${URL_OS:-$URL_ALL}"
          if [ -z "$SDK_URL" ]; then echo "::warning::Kein DeckLink-SDK-Secret für ${RUNNER_OS} – baue ohne DeckLink."; exit 0; fi
          mkdir -p sdk/decklink
          curl -fsSL "$SDK_URL" -o sdk/pkg
          MAGIC=$(head -c 2 sdk/pkg | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" = "504b" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y -bd -osdk/decklink sdk/pkg > /dev/null; else unzip -q sdk/pkg -d sdk/decklink; fi
          elif [ "$MAGIC" = "1f8b" ]; then
            tar -xzf sdk/pkg -C sdk/decklink
          elif [ "$RUNNER_OS" = "macOS" ]; then
            MNT=$(hdiutil attach -nobrowse -readonly sdk/pkg | grep -o '/Volumes/.*' | tail -1)
            cp -R "$MNT"/. sdk/decklink/ && hdiutil detach "$MNT" -quiet
          else
            echo "::error::Unbekanntes SDK-Format (kein ZIP/tar.gz). Ist der Link ein Direkt-Download?"; exit 1
          fi
          rm -f sdk/pkg
          echo "SDK entpackt:"; find sdk/decklink -name 'DeckLinkAPI.h' -o -name 'DeckLinkAPI.idl' | head

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Native Module (DeckLink + NDI)
        run: node scripts/build-native.js --optional

      - name: Tests
        run: npm test

      - name: App bauen
        run: ${{ matrix.cmd }} --publish never

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: CueGFX-${{ matrix.name }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: out/*
