# CueGFX – baut macOS (arm64 + x64), Windows und Linux auf GitHub-Runnern.
#
# Versionierung (scripts/set-version.js):
#   - normaler Lauf:  <Haupt>.<Neben> aus package.json + Build-Nummer  → z. B. 1.1.27
#   - Tag v1.2.0:      genau 1.2.0 (+ Release-Entwurf)
#   - Eingabe beim manuellen Start: genau diese Version
#
# Start:  Reiter "Actions" → "Build CueGFX" → "Run workflow"
#         oder automatisch beim Push eines Tags wie v1.0.0 (dann mit GitHub-Release)
#
# DeckLink-SDK (darf NICHT öffentlich liegen!)
# Empfohlen: Header-Ordner ins private Repo legen:
#   sdk/decklink/Mac/include, sdk/decklink/Win/include, sdk/decklink/Linux/include
# Alternativ je Betriebssystem ein Secret
# mit dem Direkt-Download-Link zum jeweiligen SDK-Paket (.zip, .tar.gz oder .dmg):
#   DECKLINK_SDK_URL_MAC     – macOS-SDK
#   DECKLINK_SDK_URL_WIN     – Windows-SDK
#   DECKLINK_SDK_URL_LINUX   – Linux-SDK
#   DECKLINK_SDK_URL         – optional: Komplett-SDK für alle, falls ein OS-Secret fehlt
# Fehlt das Secret für ein OS, wird dieses OS ohne DeckLink gebaut (NDI bleibt).
name: Build CueGFX
run-name: "Build CueGFX ${{ github.event.inputs.version || github.ref_name }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (leer = automatisch, z. B. 1.1.27)'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon wird auf dem Intel-Mac cross-kompiliert – arm64-Runner sind bei GitHub oft ausgelastet
          - { os: macos-15-intel, name: mac-arm64, arch: arm64, cmd: 'npx electron-builder --mac --arm64 -c.mac.identity=-' }
          - { os: macos-15-intel, name: mac-x64,   cmd: 'npx electron-builder --mac --x64 -c.mac.identity=-' }
          - { os: windows-latest, name: windows,   cmd: 'npx electron-builder --win' }
          - { os: ubuntu-22.04,   name: linux,     cmd: 'npx electron-builder --linux' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Linux-Pakete
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential rpm fakeroot

      - name: DeckLink-SDK laden (optional)
        shell: bash
        env:
          URL_OS: ${{ runner.os == 'macOS' && secrets.DECKLINK_SDK_URL_MAC || runner.os == 'Windows' && secrets.DECKLINK_SDK_URL_WIN || secrets.DECKLINK_SDK_URL_LINUX }}
          URL_ALL: ${{ secrets.DECKLINK_SDK_URL }}
        run: |
          SDK_URL="${URL_OS:-$URL_ALL}"
          if [ -z "$SDK_URL" ]; then
            if find sdk/decklink -name 'DeckLinkAPI.h' -o -name 'DeckLinkAPI.idl' 2>/dev/null | grep -q .; then
              echo "DeckLink-SDK-Header liegen im Repo (sdk/decklink) – kein Download nötig."
            else
              echo "::warning::Kein DeckLink-SDK im Repo und kein Secret für ${RUNNER_OS} – baue ohne DeckLink."
            fi
            exit 0
          fi
          # Freigabe-Links gängiger Cloud-Dienste in Direkt-Downloads umwandeln
          case "$SDK_URL" in
            *drive.google.com*)
              ID=$(echo "$SDK_URL" | sed -nE 's#.*/d/([^/?]+).*#\1#p; s#.*[?&]id=([^&]+).*#\1#p' | head -1)
              SDK_URL="https://drive.usercontent.google.com/download?id=${ID}&export=download&confirm=t" ;;
            *dropbox.com*)
              SDK_URL=$(echo "$SDK_URL" | sed -E 's/([?&])dl=0/\1dl=1/')
              case "$SDK_URL" in *dl=1*) ;; *\?*) SDK_URL="${SDK_URL}&dl=1" ;; *) SDK_URL="${SDK_URL}?dl=1" ;; esac ;;
            *1drv.ms*|*sharepoint.com*|*onedrive.live.com*)
              case "$SDK_URL" in *download=1*) ;; *\?*) SDK_URL="${SDK_URL}&download=1" ;; *) SDK_URL="${SDK_URL}?download=1" ;; esac ;;
            */s/*)
              # Nextcloud/ownCloud-Freigabe
              case "$SDK_URL" in */download*) ;; *) SDK_URL="${SDK_URL%/}/download" ;; esac ;;
          esac
          mkdir -p sdk/decklink
          curl -fsSL -A "Mozilla/5.0" "$SDK_URL" -o sdk/pkg
          SIZE=$(wc -c < sdk/pkg | tr -d ' ')
          echo "Heruntergeladen: ${SIZE} Bytes"
          if head -c 512 sdk/pkg | grep -qiE '<!doctype html|<html'; then
            echo "::error::Der Link für ${RUNNER_OS} liefert eine Webseite statt der SDK-Datei (Vorschau-/Login-Seite). Bitte einen Direkt-Download-Link verwenden."
            head -c 300 sdk/pkg; echo; exit 1
          fi
          MAGIC=$(head -c 2 sdk/pkg | od -An -tx1 | tr -d ' \n')
          if [ "$MAGIC" = "504b" ]; then
            if [ "$RUNNER_OS" = "Windows" ]; then 7z x -y -bd -osdk/decklink sdk/pkg > /dev/null; else unzip -q sdk/pkg -d sdk/decklink; fi
          elif [ "$MAGIC" = "1f8b" ]; then
            tar -xzf sdk/pkg -C sdk/decklink
          elif [ "$RUNNER_OS" = "macOS" ]; then
            if ! OUT=$(hdiutil attach -nobrowse -readonly sdk/pkg 2>&1); then
              echo "::error::SDK-Datei für macOS ist weder ZIP noch gültiges DMG. Erste Bytes: $(head -c 16 sdk/pkg | od -An -tx1)"; echo "$OUT"; exit 1
            fi
            MNT=$(echo "$OUT" | grep -o '/Volumes/.*' | tail -1)
            cp -R "$MNT"/. sdk/decklink/ && hdiutil detach "$MNT" -quiet
          else
            echo "::error::Unbekanntes SDK-Format für ${RUNNER_OS} (kein ZIP/tar.gz/dmg). Erste Bytes: $(head -c 16 sdk/pkg | od -An -tx1)"; exit 1
          fi
          rm -f sdk/pkg
          echo "SDK entpackt:"; find sdk/decklink -name 'DeckLinkAPI.h' -o -name 'DeckLinkAPI.idl' | head

      - name: Version setzen
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: node scripts/set-version.js

      - name: Abhängigkeiten
        run: npm install --no-audit --no-fund

      - name: Native Module (DeckLink + NDI)
        shell: bash
        run: |
          if [ -n "${{ matrix.arch }}" ]; then export npm_config_arch="${{ matrix.arch }}"; echo "Cross-Compile für ${npm_config_arch}"; fi
          node scripts/build-native.js --optional
          if [ "$RUNNER_OS" = "macOS" ]; then for f in native/*/build/Release/*.node; do [ -f "$f" ] && lipo -archs "$f" | sed "s#^#$f: #"; done; fi
          if [ -n "${{ matrix.arch }}" ]; then
            for f in native/*/build/Release/*.node; do
              [ -f "$f" ] || continue
              lipo -archs "$f" | grep -qw "${{ matrix.arch }}" || { echo "::error::$f ist nicht für ${{ matrix.arch }} gebaut"; exit 1; }
            done
          fi

      - name: Tests
        run: npm test

      - name: App bauen
        run: ${{ matrix.cmd }} --publish never

      - name: Artefakte hochladen
        uses: actions/upload-artifact@v7
        with:
          name: CueGFX-${{ steps.ver.outputs.version }}-${{ matrix.name }}
          retention-days: 14
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          name: CueGFX ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*
